name: Update Data

on:
  schedule:
    # Daily at 04:47 UTC, three and a half hours after the archive
    # repositories run (01:17 UTC). Off the hour, because GitHub starts runs
    # scheduled on the hour hours late, and late enough for every archive
    # run of the night to have finished.
    - cron: '47 4 * * *'
  repository_dispatch:
    types: [archive-updated]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild (ignore data hash check)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The loop over the lists is a script so that it can be tested; see
      # scripts/pull-archives.test.sh. One archive repository is private and
      # is read with a deploy key, which this step alone is given. Without
      # the secret that repository cannot be cloned and its list is passed
      # over, so removing the secret makes the next build leave the list
      # out, which unpublishes it. With the secret, this step fails when that
      # list cannot be read or its files cannot be vouched for, and the steps
      # below must not run then: a build without the list would delete its
      # published file.
      - name: Pull processed data from archive repos
        run: bash scripts/pull-archives.sh
        env:
          ARCHIVE_DEPLOY_KEY: ${{ secrets.ARCHIVE_DEPLOY_KEY }}

      # The spam file is an input of the build as the archives are: a night
      # on which only it changed must rebuild too.
      - name: Compute data hash
        id: data-hash
        run: |
          HASH=$({ find data/processed -name '*.json' -type f; echo scripts/spam.tsv; } | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Data hash: $HASH"

      - name: Check if rebuild is needed
        id: check-hash
        if: github.event_name == 'schedule' && inputs.force_rebuild != true
        run: |
          HASH="${{ steps.data-hash.outputs.hash }}"
          LAST_HASH=$(gh release view last-data-build --repo "${{ github.repository }}" --json body --jq '.body' 2>/dev/null || echo "none")
          echo "Current hash: $HASH"
          echo "Last build hash: $LAST_HASH"
          if [ "$HASH" = "$LAST_HASH" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Data unchanged — skipping rebuild"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Data changed — rebuilding"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup R
        if: steps.check-hash.outputs.skip != 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R dependencies
        if: steps.check-hash.outputs.skip != 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::nanoparquet
            any::dplyr
            any::scales
            any::ggplot2
            any::igraph
            any::ggraph
            any::knitr
            any::rmarkdown

      - name: Download rmail-parser
        if: steps.check-hash.outputs.skip != 'true'
        run: |
          curl -sL -o rmail-parser \
            "https://github.com/r-mailing-lists/rmail-parser/releases/latest/download/rmail-parser-linux-x86_64"
          chmod +x rmail-parser

      - name: Download aliases
        if: steps.check-hash.outputs.skip != 'true'
        run: |
          curl -sL -o aliases.json \
            "https://raw.githubusercontent.com/r-mailing-lists/rmail-parser/main/aliases.json" \
            2>/dev/null || echo '{"aliases":[]}' > aliases.json

      - name: Aggregate contributors
        if: steps.check-hash.outputs.skip != 'true'
        run: ./rmail-parser aggregate --input data/processed --output data/processed/_contributors.json --aliases aliases.json

      - name: Build parquet files
        if: steps.check-hash.outputs.skip != 'true'
        run: Rscript scripts/build-parquet.R data/processed data aliases.json

      # The Parquet files are release assets, not commits. Committing them grew
      # the repository by every changed file every day; see
      # scripts/publish-parquet.sh.
      - name: Publish parquet files
        if: steps.check-hash.outputs.skip != 'true'
        run: bash scripts/publish-parquet.sh data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Quarto
        if: steps.check-hash.outputs.skip != 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render README and analysis
        if: steps.check-hash.outputs.skip != 'true'
        run: |
          quarto render README.qmd
          quarto render analysis/demo-analysis.qmd

      - name: Commit and push
        if: steps.check-hash.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md README_files/ analysis/ 2>/dev/null || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: refresh README and analysis $(date -u +%Y-%m-%d)"
          git push

      - name: Save build hash
        if: steps.check-hash.outputs.skip != 'true'
        run: |
          HASH="${{ steps.data-hash.outputs.hash }}"
          gh release delete last-data-build --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          # --latest=false: this is a bookkeeping marker, and "latest" should
          # keep pointing at the release that holds the Parquet files.
          gh release create last-data-build \
            --repo "${{ github.repository }}" \
            --title "Last successful data build" \
            --latest=false \
            --notes "$HASH"
          echo "Saved build hash: $HASH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
