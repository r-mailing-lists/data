name: Test

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/update-data.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/update-data.yml'

jobs:
  build-parquet:
    runs-on: ubuntu-latest
    steps:
      # Only the scripts and their tests: the Parquet files are not needed here.
      # The workflows come along because the archive pull test reads one.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            tests
            .github

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::nanoparquet

      - name: Test the Parquet build
        run: Rscript tests/test-build-parquet.R

      - name: Test the spam candidate helper
        run: Rscript tests/test-spam-candidates.R

      - name: Test the Parquet publisher
        run: bash scripts/publish-parquet.test.sh

      - name: Test the archive pull
        run: bash scripts/pull-archives.test.sh
