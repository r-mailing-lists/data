name: Test

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test.yml'

jobs:
  build-parquet:
    runs-on: ubuntu-latest
    steps:
      # Only the scripts and their tests: the Parquet files are not needed here.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::nanoparquet

      - name: Test the Parquet build
        run: Rscript tests/test-build-parquet.R
